name: Deploy TreatmentLane to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: treatmentlane-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@61.0.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Vercel redacts sensitive database values during CI pulls. Run schema migrations
      # separately from an authorized environment before deploying a schema change.
      - name: Build production artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
