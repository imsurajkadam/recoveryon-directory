name: Verify TreatmentLane build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: treatmentlane-build-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Production build verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build
